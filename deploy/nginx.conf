# SpringTest 站点配置
# 用法：放到 /etc/nginx/conf.d/springtest.conf（或 include 到主配置），
#       然后 `nginx -t && systemctl reload nginx`
# 前置：把前端 `community/dist` 传到 /opt/springtest/dist
#       把证书放到 /etc/nginx/ssl/ 下

# 80 端口：跳转 443（证书签发期可临时放开 80 验证）
server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your-domain.com;

    ssl_certificate     /etc/nginx/ssl/your-domain.com.pem;
    ssl_certificate_key /etc/nginx/ssl/your-domain.com.key;

    # ---- 前端构建产物 ----
    root /opt/springtest/dist;
    index index.html;

    # SPA 路由：刷新子路由（如 /community/5）不 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 后端 API ----
    # 注意 proxy_pass 末尾不要加 "/"，否则会丢掉 /api 前缀
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 用户上传文件（后端静态映射 /uploads，转发到 8080）----
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
}
