spring:
  application:
    name: springtest

  # ------------------------------------------------------------------
  # Profile 配置
  # 敏感项（数据库密码、AI Key 等）请写入 application-local.yml，
  # 该文件已被 .gitignore 忽略，不会随仓库提交（注意也别打进生产包）。
  # 默认激活 local（本地免配置）；部署时用环境变量覆盖为 prod：
  #   容器/命令行：SPRING_PROFILES_ACTIVE=prod
  #   IDE：Run Configuration → Active profiles 填 local / prod
  #   mvn：mvn spring-boot:run -Dspring-boot.run.profiles=local
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # ------------------------------------------------------------------

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/yxy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false}
    username: ${DB_USERNAME:root}
    # 不设默认密码：本地请在 application-local.yml 配置，生产请用环境变量 DB_PASSWORD 注入
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # 留空表示 Redis 未启用密码校验；若 Redis 设置了 requirepass，通过环境变量 REDIS_PASSWORD 覆盖
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      # 超时调小：Redis 不可用时快速失败，避免请求阻塞累积占满 Tomcat 线程池。
      # 在线状态刷新等统计类操作已异步化，短超时不会拖慢业务请求。
      connect-timeout: 500ms
      timeout: 1s
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 2

mybatis:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    # 默认 info：debug 会输出请求路径、拦截原因、响应片段等细节，既影响性能也扩大日志敏感面。
    # 需要排查问题时用环境变量临时打开（无需改代码、无需重新打包）：
    #   LOGGING_LEVEL_COM_ZUEL_SPRINGTEST=debug
    com.zuel.springtest: info

# ------------------------------------------------------------------
# 自定义配置
# 所有敏感项均支持环境变量覆盖，生产环境必须显式设置，不要使用默认值
# ------------------------------------------------------------------
app:
  jwt:
    # 生产环境必须设置 JWT_SECRET，且长度 >= 64 字节（HS512 要求）。
    # 未配置时不回落到任何硬编码密钥，而是生成一次性随机密钥并打印告警（见 JwtUtils）：
    # 服务仍可启动，但重启后已签发的 Token 全部失效。
    secret: ${JWT_SECRET:}
    # Token 有效期（毫秒），默认 24 小时
    expiration: ${JWT_EXPIRATION:86400000}

  # 免登录接口白名单，支持 "METHOD:/path/**" 与 "/path/**" 两种写法
  security:
    whitelist:
      - POST:/api/auth/register
      - POST:/api/auth/login
      - GET:/api/auth/check-username
      - GET:/api/posts
      - GET:/api/posts/*
      - GET:/api/posts/game/*
      - GET:/api/comments/post/*
      - GET:/api/characters
      - GET:/api/characters/*
      - GET:/api/characters/name/*
      - GET:/api/boards
      - GET:/api/boards/*
      - GET:/api/users/*
      - GET:/api/wzry/heroes
      - GET:/api/wzry/heroes/*
      - GET:/api/statistics
      - GET:/api/ai/health

  upload:
    # 头像等上传文件的本地存储目录
    dir: ${UPLOAD_DIR:./uploads}
    # 对外访问前缀
    url-prefix: /uploads/

deepseek:
  api:
    url: ${DEEPSEEK_API_URL:https://api.deepseek.com/v1/chat/completions}
    # 必填：请在环境变量 DEEPSEEK_API_KEY 中配置，切勿写死在仓库里
    key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
  chat:
    system-prompt: 你是一个专业的游戏助手，专门回答游戏相关的问题。
    max-tokens: 1000
    temperature: 0.7

# RAG 检索所需的向量化服务（DeepSeek 不提供 embedding，需对接国内厂商如智谱/通义）
embedding:
  api:
    # 硅基流动 SiliconFlow（OpenAI 兼容，聚合 BGE/Qwen 等向量模型）。换厂商覆盖 EMBEDDING_API_URL 即可。
    url: ${EMBEDDING_API_URL:https://api.siliconflow.cn/v1/embeddings}
    # 必填：请在环境变量 EMBEDDING_API_KEY 中配置（SiliconFlow API Key），切勿写死在仓库里
    key: ${EMBEDDING_API_KEY:}
    # 默认 BAAI/bge-m3（1024 维，检索专用，无需前缀）。想用千问向量改：Qwen/Qwen3-Embedding-0.6B
    model: ${EMBEDDING_MODEL:BAAI/bge-m3}
